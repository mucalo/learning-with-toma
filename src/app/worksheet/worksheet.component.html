<div class="sheets" [style.zoom]="zoom">
  <section *ngFor="let page of pages; let p = index" class="sheet" [attr.aria-label]="i18n.t.worksheet.pageLabel.replace('{page}', '' + (p + 1)).replace('{count}', '' + pages.length)">
    <header class="sheet-header">
      <p class="worksheet-instruction">{{ instruction }}</p>
    </header>

    <div class="sheet-body">
      <div *ngFor="let index of page" class="worksheet-row" [attr.data-index]="index">
        <ng-container *ngIf="rowTemplate">
          <ng-container *ngTemplateOutlet="rowTemplate; context: { $implicit: items[index], index: index }"></ng-container>
        </ng-container>
      </div>
    </div>

    <footer class="sheet-footer">
      <span>{{ i18n.t.header.appTitle }}<ng-container *ngIf="activityTitle"> · {{ activityTitle }}</ng-container></span>
      <span>learningwithtoma.com<ng-container *ngIf="pages.length > 1"> · {{ p + 1 }}/{{ pages.length }}</ng-container></span>
    </footer>
  </section>
</div>
