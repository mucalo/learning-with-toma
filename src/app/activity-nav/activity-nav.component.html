<nav class="activity-nav" [attr.aria-label]="i18n.t.activityPage.switcher">
  <!-- Arrows are a mouse convenience: keyboard users tab through the links, which scroll into view. -->
  <button type="button" class="scroll-button" tabindex="-1" aria-hidden="true" [disabled]="!canScrollBack" (click)="scroll(-1)">
    <svg width="18" height="18" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" /></svg>
  </button>

  <div
    #scroller
    class="scroller"
    [class.fade-start]="canScrollBack"
    [class.fade-end]="canScrollForward"
    (scroll)="updateArrows()"
  >
    <ul #track class="activity-links">
      <li *ngFor="let activity of activities">
        <a
          class="activity-link"
          [routerLink]="activity.route"
          routerLinkActive="is-current"
          #link="routerLinkActive"
          [attr.aria-current]="link.isActive ? 'page' : null"
        >
          <app-activity-icon [activity]="activity.key" [size]="26"></app-activity-icon>
          {{ i18n.t.activities[activity.key].title }}
        </a>
      </li>
    </ul>
  </div>

  <button type="button" class="scroll-button" tabindex="-1" aria-hidden="true" [disabled]="!canScrollForward" (click)="scroll(1)">
    <svg width="18" height="18" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" /></svg>
  </button>
</nav>
