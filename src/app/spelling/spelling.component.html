<section class="spelling-card">
  <div class="back-link-container">
    <a routerLink="/" class="back-link">{{ i18n.t.common.backToMenu }}</a>
  </div>

  <div class="controls">
    <div class="field">
      <label for="problemCount">{{ i18n.t.common.numberOfProblems }}</label>
      <input id="problemCount" type="number" min="1" max="100" [(ngModel)]="problemCount" />
    </div>

    <div class="field">
      <label for="maxLetters">{{ i18n.t.spelling.maxLetters }}</label>
      <input id="maxLetters" type="number" min="1" max="10" [(ngModel)]="maxLetters" />
    </div>

    <button type="button" class="generate-button" (click)="generateProblems()">{{ i18n.t.common.generate }}</button>
    <button type="button" class="print-button" (click)="printWorksheet()" [disabled]="generatedItems.length === 0">{{ i18n.t.common.print }}</button>
  </div>

  <app-worksheet *ngIf="generatedItems.length > 0" [instruction]="i18n.t.spelling.instruction" [items]="generatedItems">
    <ng-template let-item let-i="index">
      <div class="problem-row">
        <div class="image-area" [attr.aria-label]="i18n.t.spelling.picture">
          <span class="emoji">{{ item.emoji }}</span>
        </div>

        <div class="answer-area">
          <div class="lines" *ngFor="let group of getDisplayGroups(item)">
            <span class="line" [class.combined]="group.isCombined"></span>
          </div>
        </div>

        <div class="action-area">
          <div class="hint-wrapper">
            <button type="button" class="action-button hint-button" (click)="revealWord(item)" [attr.aria-label]="i18n.t.spelling.showWord">
              ?
            </button>
            <div class="hint-bubble" *ngIf="item.wordRevealed">
              {{ item.word }}
            </div>
          </div>

          <button type="button" class="action-button remove-button" (click)="removeItem(i)" [attr.aria-label]="i18n.t.common.removeRow">
            ✕
          </button>
        </div>
      </div>
    </ng-template>
  </app-worksheet>
</section>
