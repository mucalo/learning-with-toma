<section class="home-page" [attr.aria-label]="i18n.t.home.activitiesLabel">
  <div class="home-intro">
    <h1>{{ i18n.t.home.heading }}</h1>
    <p>{{ i18n.t.home.intro }}</p>
  </div>

  <div class="activity-grid">
    <a
      *ngFor="let activity of activities"
      class="activity-card"
      [routerLink]="activity.route"
      [attr.aria-label]="i18n.t.activities[activity.key].title"
    >
      <div class="activity-illustration" aria-hidden="true">{{ activity.emoji }}</div>
      <div class="activity-content">
        <h2>{{ i18n.t.activities[activity.key].title }}</h2>
        <p>{{ i18n.t.activities[activity.key].description }}</p>
      </div>
    </a>
  </div>
</section>
