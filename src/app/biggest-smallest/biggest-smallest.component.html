<app-activity-page activity="biggestSmallest" [hasWorksheet]="generatedItems.length > 0" (generate)="generateProblems()" (print)="printWorksheet()">
  <div settings>
    <div class="field">
      <label for="problemCount">{{ i18n.t.common.numberOfProblems }}</label>
      <input id="problemCount" type="number" min="1" max="100" [(ngModel)]="problemCount" />
    </div>

    <div class="field">
      <label for="maxItems">{{ i18n.t.biggestSmallest.maxItems }}</label>
      <input id="maxItems" type="number" min="3" max="20" [(ngModel)]="maxItems" />
    </div>

    <p class="error-message" role="alert" *ngIf="showMinItemsError">{{ i18n.t.biggestSmallest.minItemsError }}</p>
  </div>

  <app-worksheet *ngIf="generatedItems.length > 0" [instruction]="i18n.t.biggestSmallest.instruction" [items]="generatedItems">
    <ng-template let-item let-i="index">
      <div class="problem-row">
        <div class="items-container" [attr.aria-label]="i18n.t.biggestSmallest.itemsToCompare">
          <span 
            *ngFor="let positioned of item.positioned" 
            class="item-emoji"
            [style.left.px]="positioned.x"
            [style.top.px]="positioned.y"
            [style.font-size.rem]="positioned.size"
          >
            {{ positioned.emoji }}
          </span>
        </div>
      </div>
    </ng-template>
  </app-worksheet>
</app-activity-page>
