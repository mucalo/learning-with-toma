<section class="maze-card">
  <div class="back-link-container">
    <a routerLink="/" class="back-link">{{ i18n.t.common.backToMenu }}</a>
  </div>

  <div class="controls">
    <div class="field">
      <label for="problemCount">{{ i18n.t.common.numberOfProblems }}</label>
      <input id="problemCount" type="number" min="1" max="20" [(ngModel)]="problemCount" />
    </div>

    <div class="field">
      <label for="size">{{ i18n.t.maze.size }}</label>
      <select id="size" [(ngModel)]="size">
        <option *ngFor="let option of sizes" [ngValue]="option">{{ sizeLabel(option) }}</option>
      </select>
    </div>

    <button type="button" class="generate-button" (click)="generateProblems()">{{ i18n.t.common.generate }}</button>
    <button type="button" class="print-button" (click)="printWorksheet()" [disabled]="generatedItems.length === 0">{{ i18n.t.common.print }}</button>
  </div>

  <app-worksheet *ngIf="generatedItems.length > 0" [instruction]="i18n.t.maze.instruction" [items]="generatedItems">
    <ng-template let-item let-i="index">
      <div class="problem-row">
        <svg class="maze" [attr.viewBox]="item.viewBox" role="img" [attr.aria-label]="i18n.t.maze.mazeLabel">
          <svg:path *ngIf="item.answerRevealed" class="solution" [attr.d]="item.solution" />
          <svg:path class="walls" [attr.d]="item.walls" />
          <svg:text class="picture" [attr.x]="cell / 2" [attr.y]="cell / 2" [attr.font-size]="cell * 0.72">{{ item.start }}</svg:text>
          <svg:text class="picture" [attr.x]="item.size * cell - cell / 2" [attr.y]="item.size * cell - cell / 2" [attr.font-size]="cell * 0.72">{{ item.goal }}</svg:text>
        </svg>

        <div class="action-area">
          <button type="button" class="action-button hint-button" (click)="revealAnswer(item)" [attr.aria-label]="i18n.t.maze.showAnswer">
            ?
          </button>
          <button type="button" class="action-button remove-button" (click)="removeItem(i)" [attr.aria-label]="i18n.t.common.removeRow">
            ✕
          </button>
        </div>
      </div>
    </ng-template>
  </app-worksheet>
</section>
