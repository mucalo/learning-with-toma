<button
  type="button"
  class="language-toggle"
  aria-controls="language-list"
  [attr.aria-expanded]="open"
  (click)="open = !open"
>
  <img class="flag" [src]="current.flag" width="21" height="14" alt="" />
  <span class="visually-hidden">{{ i18n.t.header.languageLabel }}:</span>
  {{ current.shortLabel }}
  <span class="caret" aria-hidden="true">▾</span>
</button>

<ul id="language-list" class="language-list" *ngIf="open">
  <li *ngFor="let option of i18n.languages">
    <button
      type="button"
      class="language-option"
      [attr.lang]="option.htmlLang"
      [attr.aria-pressed]="option.value === i18n.language"
      (click)="choose(option.value)"
    >
      <img class="flag" [src]="option.flag" width="21" height="14" alt="" />
      {{ option.label }}
    </button>
  </li>
</ul>
