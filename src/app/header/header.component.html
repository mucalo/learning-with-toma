<header class="site-header" [class.menu-open]="menuOpen">
  <div class="header-inner">
    <a routerLink="/" class="logo" [attr.aria-label]="i18n.t.header.appTitle" (click)="goHome()">
      <span class="logo-tile" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24"><path d="M9 3v14a3 3 0 0 0 5 2" /><path d="M5 8h9" /></svg>
      </span>
      <span class="logo-text" aria-hidden="true">{{ i18n.t.header.logoLines[0] }}<br /><span class="logo-second">{{ i18n.t.header.logoLines[1] }}</span></span>
    </a>

    <nav id="main-menu" class="main-menu" [attr.aria-label]="i18n.t.menu.label">
      <a
        *ngFor="let section of sections"
        class="menu-link"
        [class.is-current]="section.id === 'activities' && onActivityPage"
        routerLink="/"
        [fragment]="section.id"
        (click)="goToSection(section.id)"
      >
        {{ i18n.t.menu.items[section.key] }}
      </a>
    </nav>

    <div class="header-actions">
      <app-language-picker *ngIf="!onActivityPage"></app-language-picker>

      <a
        class="support-link"
        [class.btn]="!onActivityPage"
        [class.btn-outline]="!onActivityPage"
        routerLink="/"
        fragment="help"
        (click)="goToSection('help')"
      >
        <svg class="heart" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" />
        </svg>
        <span class="support-text">{{ i18n.t.header.support }}</span>
      </a>

      <a *ngIf="onActivityPage" class="btn btn-outline all-activities" routerLink="/" fragment="activities" (click)="goToSection('activities')">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" /></svg>
        {{ i18n.t.header.allActivities }}
      </a>

      <button
        type="button"
        class="menu-toggle"
        aria-controls="main-menu"
        [attr.aria-label]="i18n.t.menu.openMenu"
        [attr.aria-expanded]="menuOpen"
        (click)="toggleMenu()"
      >
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <path *ngIf="!menuOpen" d="M4 7h16M4 12h16M4 17h16" />
          <path *ngIf="menuOpen" d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>
  </div>
</header>
