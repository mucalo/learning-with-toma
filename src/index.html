<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Learning with Toma</title>
  <base href="/">
  <script>
    // Old addresses had the page after a # (/#/maze, /#/#about); open the real one instead.
    if (location.hash.indexOf('#/') === 0) {
      location.replace(location.hash.slice(1));
    }
    // Pages are prerendered in English. For visitors who chose another language, keep the page
    // hidden until the app has switched it, rather than flash the English text first.
    try {
      var language = localStorage.getItem('lwt-language');
      if (language && language !== 'english') {
        document.documentElement.classList.add('lwt-switching-language');
      }
    } catch (e) {}
  </script>
  <style>.lwt-switching-language app-root { visibility: hidden; }</style>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Printable worksheets for little learners, ready in seconds. Free activities for children aged 4–7 in English, Croatian and Serbian.">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#C2410C">
  <!-- Link previews. Each page adds its own og:title, og:description and og:url (PageMetaService). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Learning with Toma">
  <meta property="og:locale" content="en_GB">
  <meta property="og:image" content="https://learningwithtoma.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Learning with Toma: printable worksheets for little learners. 100% free, ages 4–7, 3 languages.">
  <meta name="twitter:card" content="summary_large_image">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://learningwithtoma.com/#website",
      "name": "Learning with Toma",
      "alternateName": "Učimo s Tomom",
      "url": "https://learningwithtoma.com/",
      "description": "Free printable worksheets for children aged 4–7, in English, Croatian and Serbian. Made for parents, preschool educators and school teachers.",
      "inLanguage": ["en", "hr", "sr-Latn"],
      "isAccessibleForFree": true
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Andika:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
