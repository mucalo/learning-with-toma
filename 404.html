  <script>
    // Old addresses had the page after a # (/#/maze, /#/#about); open the real one instead.
    if (location.hash.indexOf('#/') === 0) {
      location.replace(location.hash.slice(1));
    }
    // On an English page, the app sends visitors who prefer Croatian or Serbian to the same page in
    // their language. Keep the page hidden until then, rather than flash the English text first.
    // The same guess as LanguageService.preferredLanguage(): their earlier choice, or else the
    // first of the browser's languages that the site has.
    (function () {
      if (/^\/(hr|sr)(\/|$)/.test(location.pathname)) {
        return;
      }
      var preferred = null;
      try {
        preferred = localStorage.getItem('lwt-language');
      } catch (e) {}
      if (!preferred) {
        var languages = { en: 'english', hr: 'croatian', sr: 'serbian', bs: 'serbian', cnr: 'serbian' };
        var codes = navigator.languages || [navigator.language];
        for (var i = 0; i < codes.length && !preferred; i++) {
          preferred = languages[String(codes[i]).toLowerCase().split('-')[0]] || null;
        }
      }
      if (preferred === 'croatian' || preferred === 'serbian') {
        document.documentElement.classList.add('lwt-switching-language');
      }
    })();
  </script>
  <style>.lwt-switching-language app-root { visibility: hidden; }</style>
